<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <style>
      .mark { fill: #2C2A29; }
      .brand-title { font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 26px; fill: #2C2A29; letter-spacing: 2px; }
      .brand-sub { font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 300; font-size: 11px; fill: #666666; letter-spacing: 4px; text-transform: uppercase; }
    </style>
  </defs>
  
  <!-- Studio Monogram Icon -->
  <g transform="translate(10, 14)">
    <circle cx="26" cy="26" r="25" fill="none" stroke="#2C2A29" stroke-width="2"/>
    <path d="M 26 10 L 38 42 L 14 42 Z" fill="none" stroke="#2C2A29" stroke-width="2"/>
    <circle cx="26" cy="30" r="4" fill="#2C2A29"/>
  </g>
  
  <!-- Wordmark -->
  <text x="75" y="40" class="brand-title">STUDIO</text>
  <text x="75" y="58" class="brand-sub">ARTISANA</text>
</svg>
